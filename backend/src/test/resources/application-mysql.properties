# Local MySQL profile for the workflow queue's integration tests.
#
# It contains no credentials. The datasource values come from the same environment variables the
# application reads (and from the root .env that Spring already imports), so a developer who has
# provisioned MySQL runs these tests against their own instance and nobody commits a password.
#
# Everything here is topology and bounds; the tests that use it are skipped unless
# FINALAGENT_TEST_MYSQL=true is set, because a queue's locking guarantees cannot be shown
# against an in-memory double.

spring.flyway.enabled=true

finalagent.execution.enabled=true
# The tenant these fixtures write into is `00000000-0000-0000-0000-000000000ff1`, but it is not
# configured here: since V5 the workspace a request is scoped to comes from the session, and the
# suites name it by provisioning that row and binding a principal to it.
#
# The maximum: the tests drive the claim loop by hand, and a background poll firing mid-assertion
# would make "what had been scheduled by then" depend on thread timing.
finalagent.execution.poll-interval-ms=60000
finalagent.execution.batch-size=4
finalagent.execution.core-pool-size=2
finalagent.execution.max-pool-size=4
finalagent.execution.queue-capacity=16
# 30 seconds. Two things make a tight lease wrong here, and both were met in practice. A claim whose
# holder is descheduled for longer than the lease is reclaimed by the same test that made it, so the
# job runs twice and an assertion written to catch a lost job fails for the wrong reason. And a second
# process pointed at this schema — the running dev backend, say — polls this same table every 500ms
# and will finish an export a test is mid-cancelling, which looks exactly like a product bug and is
# not one. Run these suites with no other backend against the database; lease reclaim itself is still
# covered, because WorkflowQueueMySqlTest forces it by writing `lease_expires_at` into the past.
finalagent.execution.lease-seconds=30
finalagent.execution.heartbeat-seconds=5
finalagent.execution.max-attempts=3
finalagent.execution.backoff-base-seconds=1
finalagent.execution.backoff-max-seconds=2
finalagent.execution.step-timeout-ms=2000

# Four workers, a heartbeat per claimed job and the poller all want a connection at once; the
# default pool of 10 makes the concurrency tests measure pool exhaustion instead of locking.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000

logging.level.root=WARN
logging.level.ai.finalagent=WARN

# Exports: a small chunk and a small ceiling, so a test can watch progress move across several
# checkpoints and can cross the ceiling without writing two hundred thousand rows.
finalagent.export.dir=./var/exports
finalagent.export.chunk-rows=2
finalagent.export.max-rows=12
