server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: finalagent-backend

  # Local development reads the single root .env. Deployment supplies real environment
  # variables instead; `optional:` means an absent file is not an error, the blank
  # credential checks are.
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  datasource:
    # Credential defaults are deliberately absent below. Only host/port/database names have
    # defaults, because those are topology, not secrets.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finalagent_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: finalagent-hikari
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 5000
      # Startup enforces that credentials are *configured*; /ready enforces that MySQL is
      # *reachable*. Without this, a stopped database would abort boot with a stack trace
      # instead of a 503 naming the failing component.
      initialization-fail-timeout: -1

  flyway:
    # Migrations are the schema, so this is the same switch as the workflow layer itself rather
    # than a second thing to remember to turn on.
    enabled: ${WORKFLOW_EXECUTION_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    # No baselining: baselining away an existing schema would skip the DDL the queue's
    # guarantees actually live in — the unique keys, the composite FKs, the claim index.
    baseline-on-migrate: false

finalagent:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  database:
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    name: ${MYSQL_DATABASE:finalagent_dev}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:3000}
  # The workflow layer. Off by default: without a reachable MySQL the rest of the service still
  # answers health and requirement parsing honestly, instead of failing to boot.
  execution:
    enabled: ${WORKFLOW_EXECUTION_ENABLED:false}
    # No tenant is configured here. The workspace a request is scoped to comes from the authenticated
    # session, and the tenant a queue job runs in is carried on the job row. A configured tenant was a
    # placeholder that made every caller the same person; `V5__baseline_identity.sql` retired it.
    poll-interval-ms: ${WORKFLOW_POLL_INTERVAL_MS:500}
    batch-size: ${WORKFLOW_BATCH_SIZE:4}
    core-pool-size: ${WORKFLOW_CORE_POOL_SIZE:4}
    max-pool-size: ${WORKFLOW_MAX_POOL_SIZE:8}
    queue-capacity: ${WORKFLOW_QUEUE_CAPACITY:100}
    # A worker that dies holds its jobs for one lease, no longer. The lease must outlast a whole
    # step with room to spare: a lease that expires mid-step is a second worker starting the same
    # collection while the first is still spending credits on it.
    lease-seconds: ${WORKFLOW_LEASE_SECONDS:300}
    heartbeat-seconds: ${WORKFLOW_HEARTBEAT_SECONDS:30}
    max-attempts: ${WORKFLOW_MAX_ATTEMPTS:3}
    backoff-base-seconds: ${WORKFLOW_BACKOFF_BASE_SECONDS:1}
    backoff-max-seconds: ${WORKFLOW_BACKOFF_MAX_SECONDS:120}
    # Bounds the wait for one step's answer. A step that exceeds it is retried per policy; the
    # abandoned HTTP call still finishes under its own timeout, because Firecrawl exposes no
    # run-level abort.
    step-timeout-ms: ${WORKFLOW_STEP_TIMEOUT_MS:240000}
  export:
    # Server-side directory for finished export files. A request never names a path: the export id
    # is the only handle a caller gets, and the file is resolved from it.
    dir: ${FINALAGENT_EXPORT_DIR:./var/exports}
    # Rows per write before the job reports progress again. Progress is derived from rows actually
    # handed to the writer, so this is also how coarsely an export's percentage moves.
    chunk-rows: ${FINALAGENT_EXPORT_CHUNK_ROWS:500}
    max-rows: ${FINALAGENT_EXPORT_MAX_ROWS:200000}
  auth:
    # Sessions and passwords. Every value here is a policy number, not a credential, so each has a
    # default: nothing in this group is a secret, and the design deliberately has no signing key at
    # all — a session is an opaque random value stored by its SHA-256, so there is no JWT secret that
    # could ever be handed to the frontend by mistake.
    access-token-ttl-minutes: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:14}
    absolute-ttl-days: ${AUTH_ABSOLUTE_TTL_DAYS:30}
    # The `Secure` flag on the session cookie. Off for the local stack, which is served over http;
    # any deployment that terminates TLS must set this to true, because a session cookie sent in clear
    # text is the credential walking the wire unsealed.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}

app:
  version: 0.1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness must never depend on MySQL: a database outage would otherwise make the
        # orchestrator restart healthy processes in a loop. Readiness is where reachability
        # belongs, and /api/v1/ready is the browser-facing form of the same judgement.
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

logging:
  level:
    root: ${LOG_LEVEL:INFO}
